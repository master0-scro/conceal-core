name: Build check

on:
  pull_request:
  push:
    tags-ignore:
      - "*" # We don't want this to run on release
  pull_request:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      BOOST_ROOT: C:/local/boost_1_83_0
    steps:
      - uses: actions/checkout@v5

      - name: Prepare version
        shell: powershell
        id: setup
        run: "echo skipped-for-baseline-isolation"
      - name: Install msbuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore Boost
        uses: actions/cache@v5
        id: restore-boost
        with:
          path: ${{env.BOOST_ROOT}}
          key: boost_1_83_0-msvc-14.3-64

      - name: Install Boost
        if: steps.restore-boost.outputs.cache-hit != 'true'
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: Build
        shell: powershell
        id: build
        run: "echo skipped-for-baseline-isolation"
      - name: Prepare release
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/conceal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: core_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: difficulty_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: performance_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: unit_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
  build-mingw:
    name: MinGW
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run: "echo skipped-for-baseline-isolation"
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake

      - name: Install dependencies
        run: |
          pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-boost-1.85.0-4-any.pkg.tar.zst

      - name: Prepare version
        shell: powershell
        id: setup
        run: "echo skipped-for-baseline-isolation"
      - name: Build
        shell: msys2 {0}
        id: build
        run: |
          ls
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DSTATIC=ON
          cmake --build . --config Release

      - name: Prepare release
        shell: msys2 {0}
        run: "echo skipped-for-baseline-isolation"
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/conceal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: core_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: difficulty_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: performance_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
      - name: unit_tests
        shell: powershell
        run: "echo skipped-for-baseline-isolation"
  build-ubuntu22:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare version
        id: setup
        run: "echo skipped-for-baseline-isolation"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake gcc g++ libboost-all-dev

      - name: Build
        id: build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DSTATIC=ON
          make -j2

      - name: Prepare release
        run: "echo skipped-for-baseline-isolation"
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/conceal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: core_tests
        run: "echo skipped-for-baseline-isolation"
      - name: difficulty_tests
        run: "echo skipped-for-baseline-isolation"
      - name: performance_tests
        run: "echo skipped-for-baseline-isolation"
      - name: system_tests
        run: "echo skipped-for-baseline-isolation"
      - name: unit_tests
        run: "echo skipped-for-baseline-isolation"
  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare version
        id: setup
        run: "echo skipped-for-baseline-isolation"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake gcc g++ libboost-all-dev

      - name: Build
        id: build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DSTATIC=ON
          make -j2

      - name: Prepare release
        run: "echo skipped-for-baseline-isolation"
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/conceal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: core_tests
        run: "echo skipped-for-baseline-isolation"
      - name: difficulty_tests
        run: "echo skipped-for-baseline-isolation"
      - name: performance_tests
        run: "echo skipped-for-baseline-isolation"
      - name: system_tests
        run: "echo skipped-for-baseline-isolation"
      - name: unit_tests
        run: "echo skipped-for-baseline-isolation"
  build-ubuntu22-clang:
    name: Ubuntu 22.04 clang
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare version
        id: setup
        run: "echo skipped-for-baseline-isolation"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake clang libboost-all-dev

      - name: Build
        id: build
        run: |
          mkdir build
          cd build
          CC=clang CXX=clang++ cmake .. -DCMAKE_BUILD_TYPE=Release  -DBUILD_TESTS=ON -DSTATIC=ON
          make -j2

      - name: Prepare release
        run: "echo skipped-for-baseline-isolation"
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/conceal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: core_tests
        run: "echo skipped-for-baseline-isolation"
      - name: difficulty_tests
        run: "echo skipped-for-baseline-isolation"
      - name: performance_tests
        run: "echo skipped-for-baseline-isolation"
      - name: system_tests
        run: "echo skipped-for-baseline-isolation"
      - name: unit_tests
        run: "echo skipped-for-baseline-isolation"
  build-macos:
    name: macOS
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare version
        id: setup
        run: "echo skipped-for-baseline-isolation"
      - name: Install dependencies
        run: |
          brew install boost
          brew list --versions boost

      - name: Build
        id: build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DSTATIC=ON -DBOOST_ROOT="$(brew --prefix boost)"
          make -j2

      - name: Prepare release
        run: "echo skipped-for-baseline-isolation"
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/conceal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: core_tests
        run: "echo skipped-for-baseline-isolation"
      - name: difficulty_tests
        run: "echo skipped-for-baseline-isolation"
      - name: performance_tests
        run: "echo skipped-for-baseline-isolation"
      - name: unit_tests
        run: "echo skipped-for-baseline-isolation"
